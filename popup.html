<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Translator-plugin</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="popup-header">
      <div>
        <h1>Translator-plugin</h1>
        <p id="entryCount" class="entry-count">0 个词条</p>
      </div>
      <button id="settingsButton" class="settings-button" type="button">设置</button>
    </header>

    <main>
      <button id="openVocabularyButton" class="open-vocabulary-button" type="button">打开生词本</button>
      <section id="emptyState" class="empty-state" hidden>
        还没有保存词条。请在网页中选中文字后点击浮窗加入，也可以右键加入生词本。
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
