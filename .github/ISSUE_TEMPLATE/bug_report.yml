name: Bug report
description: Report a problem found while testing Orange翻译
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      placeholder: "Example: Chrome 126"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Example: Windows 11"
  - type: dropdown
    id: provider
    attributes:
      label: Provider mode
      options:
        - Mock
        - Baidu
        - Gemini
        - DeepSeek
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Click..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: textarea
    id: actual
    attributes:
      label: Actual result
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Do not paste real API keys.
